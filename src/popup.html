<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>划词译</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 328px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px; color: #1F2329; background: #fff; line-height: 1.6;
  }
  header { display: flex; align-items: center; gap: 8px; padding: 13px 16px; border-bottom: 1px solid #F0F1F4; }
  /* LOGO：亮绿底板 + 天青色 Snell Roundhand 花体 S + 水平 180° 横转 + 重影式重叠 */
  .logo {
    width: 22px; height: 22px; border-radius: 6px; flex: 0 0 auto;
    background: linear-gradient(180deg, #3DFF9E, #00C853);
    display: flex; align-items: center; justify-content: center;
    font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", "Apple Chancery", cursive;
    font-weight: 700; font-size: 19px; line-height: 1; color: #B8E7FA;
    transform: scaleX(-1);                       /* 水平 180° 横转 */
    animation: st-jitter 2.6s infinite steps(1, end);
  }
  /* 重影：白色偏左上 + 深墨偏右下，构成色差抖动 */
  @keyframes st-jitter {
    0%, 86%   { text-shadow: -1px -1px 0 rgba(255,255,255,.8), 1px 1px 0 rgba(6,32,62,.9);   transform: scaleX(-1) translate(0, 0); }
    88%, 90%  { text-shadow: -2px 0 0 rgba(255,255,255,.8),    2px 0 0 rgba(6,32,62,.9);     transform: scaleX(-1) translate(0, -1px); }
    92%, 94%  { text-shadow: 0 -2px 0 rgba(255,255,255,.8),    0 2px 0 rgba(6,32,62,.9);     transform: scaleX(-1) translate(1px, 0); }
    96%, 97%  { text-shadow: -2px -2px 0 rgba(255,255,255,.8), 2px 2px 0 rgba(6,32,62,.9);   transform: scaleX(-1) translate(-1px, 1px); }
    98%, 100% { text-shadow: -1px -1px 0 rgba(255,255,255,.8), 1px 1px 0 rgba(6,32,62,.9);   transform: scaleX(-1) translate(0, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  .name { font-size: 13.5px; font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #C6CBD3; margin-left: auto; }
  .dot.on { background: #1D9E75; }
  .dot.warn { background: #E0A11B; }
  section { padding: 12px 16px; border-bottom: 1px solid #F5F6F8; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .label { color: #6B7280; font-size: 12px; }
  select {
    font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid #DDE0E6;
    border-radius: 6px; background: #fff; color: #1F2329; outline: none; max-width: 150px;
  }
  select:focus { border-color: #185FA5; }
  button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid #DDE0E6; background: #fff; color: #374151;
  }
  button:hover { border-color: #B9CBE0; color: #185FA5; }
  button.primary { background: #185FA5; border-color: #185FA5; color: #fff; }
  button.primary:hover { background: #134B84; color: #fff; }
  .auth { display: flex; align-items: center; gap: 8px; }
  .auth-info { font-size: 11.5px; color: #8A919D; }
  .auth-info b { color: #1D9E75; font-weight: 500; }
  .sources { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #374151; cursor: pointer; }
  input[type=checkbox] { accent-color: #185FA5; width: 13px; height: 13px; }
  footer { display: flex; gap: 8px; padding: 11px 16px; background: #FAFBFC; }
  footer button { flex: 1; }
  .note { font-size: 11px; color: #9AA1AC; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <div class="name">划词译</div>
  <div class="dot" id="statusDot"></div>
</header>

<section>
  <div class="auth" id="authBox"></div>
  <div class="note" id="authNote">在网页中划选文字即可查询。</div>
</section>

<section>
  <div class="row">
    <span class="label">目标语言</span>
    <select id="targetLang">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
      <option value="fr">法语</option>
      <option value="de">德语</option>
      <option value="es">西班牙语</option>
      <option value="ru">俄语</option>
    </select>
  </div>
  <div class="row">
    <span class="label">触发方式</span>
    <select id="trigger">
      <option value="icon">划词后显示气泡按钮</option>
      <option value="auto">划词后自动弹出</option>
      <option value="alt">按住 Alt 划词</option>
    </select>
  </div>
  <div class="row">
    <span class="label">翻译通道</span>
    <select id="provider">
      <option value="chrome-ai">Chrome 内置 AI（零配置）</option>
      <option value="deepl">DeepL（长句质量最好）</option>
      <option value="azure">Microsoft Translator</option>
      <option value="google">Google 翻译</option>
      <option value="libre">LibreTranslate</option>
      <option value="openai">自定义模型（OpenAI 兼容）</option>
      <option value="free-mt">免费机器翻译</option>
    </select>
  </div>
  <div class="row">
    <span class="label">并列对照</span>
    <label class="chk" title="勾选哪些通道在设置页第 1 节里配置"><input type="checkbox" id="cmpEnabled">并排显示多个通道</label>
  </div>
</section>

<section>
  <div class="row" style="margin-bottom:9px"><span class="label">词典来源</span></div>
  <div class="sources">
    <label class="chk"><input type="checkbox" id="src-youdao">有道英汉双解</label>
    <label class="chk"><input type="checkbox" id="src-collins">柯林斯高阶</label>
    <label class="chk"><input type="checkbox" id="src-sentences">双语例句</label>
    <label class="chk"><input type="checkbox" id="src-wiktionary">Wiktionary</label>
    <label class="chk"><input type="checkbox" id="src-freedict">Free Dictionary</label>
    <label class="chk"><input type="checkbox" id="src-ydsimple">有道简明</label>
  </div>
</section>

<footer>
  <button id="openOptions">设置</button>
  <button id="clearCache">清缓存</button>
</footer>

<script src="popup.js"></script>
</body>
</html>
